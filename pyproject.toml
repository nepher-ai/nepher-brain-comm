[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nepher-brain"
version = "1.0.0"
description = "Lockstep protocol and image contract for Nepher tournament brains."
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
authors = [{name = "Nepher Robotics"}]
dependencies = [
    "msgpack>=1.0",
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
nepher-brain = "nepher_brain.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nepher_brain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
